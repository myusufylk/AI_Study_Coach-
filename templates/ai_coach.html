{% extends "base.html" %}

{% block title %}AI Coach{% endblock %}

{% block content %}

<div class="form-container">
    <div class="form-box" style="max-width:700px;">

        <h2>🤖 AI Study Coach</h2>

        <form method="POST">
            {% csrf_token %}

            <textarea 
                name="user_query"
                placeholder="Çalışma ile ilgili sorunu yaz..."
                style="width:100%; height:120px; margin-top:15px;">
            </textarea>

            <br><br>

            <button type="submit">
                Sor
            </button>

        </form>

        {% if response %}
        <div style="margin-top:25px;">
            <h3>AI Cevabı</h3>
            <p>{{ response }}</p>
        </div>
        {% endif %}

    </div>
</div>

{% endblock %}
