{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="form-container">
        <div class="form-box">
            <h2>Giriş Yap</h2>

            {% if messages %}
                {% for message in messages %}
                    <div style="color: #ef4444; background-color: #fef2f2; padding: 12px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-size: 14px; border: 1px solid #fee2e2; font-weight: 500;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %} <div class="input-group">
                    <label for="username">Email veya Kullanıcı Adı</label>
                    <input type="text" id="username" name="username" placeholder="Email veya Kullanıcı Adı girin" required>
                </div>
                <div class="input-group">
                    <label for="password">Şifre</label>
                    <input type="password" id="password" name="password" placeholder="Şifrenizi girin" required>
                </div>
                <button type="submit" class="submit-btn">Giriş Yap</button>
            </form>
            <p class="form-footer">Hesabınız yok mu? <a href="{% url 'register' %}">Kayıt Ol</a></p>
        </div>
    </div>
</body>
</html>
