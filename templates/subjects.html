{% load static %}
{% load core_extras %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders Seçimi - Eğitim Planlama</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/subjects_style.css' %}">
</head>
<body>

    <div class="goals-container">
        <div class="goals-header">
            <h1>Ders Seçimi</h1>
            <p>Çalışmak istediğiniz dersleri belirleyin</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="goals-form-group goals-checkbox-list">
                {% for course in courses %}
                <div class="subject-item-container">
                    <label class="goals-checkbox-item">
                        <input type="checkbox" name="subject_ids" value="{{ course.id }}" 
                               {% if course.id in selected_ids %}checked{% endif %}
                               onchange="toggleTopicInput(this, 'topic_input_{{ course.id }}')">
                        <span class="goals-checkbox-label">{{ course.name }}</span>
                    </label>
                    
                    <div id="topic_input_{{ course.id }}" class="topic-input-wrapper {% if course.id in selected_ids %}is-visible{% endif %}">
                        <input type="text" name="topic_{{ course.id }}" 
                               placeholder="Hangi konuya çalışacaksın?"
                               class="topic-text-input"
                               value="{{ current_topics|get_item:course.name }}">
                    </div>
                </div>
                {% empty %}
                <p>Henüz ders tanımlanmamış. Lütfen yöneticiyle iletişime geçin.</p>
                {% endfor %}
            </div>

            <button type="submit" class="goals-btn-submit">Kaydet</button>
        </form>

        <script>
            function toggleTopicInput(checkbox, inputId) {
                const inputWrapper = document.getElementById(inputId);
                if (checkbox.checked) {
                    inputWrapper.classList.add('is-visible');
                    inputWrapper.style.opacity = '0';
                    setTimeout(() => {
                        inputWrapper.style.transition = 'opacity 0.3s ease';
                        inputWrapper.style.opacity = '1';
                    }, 10);
                } else {
                    inputWrapper.classList.remove('is-visible');
                }
            }
        </script>

        <style>
            .subject-item-container {
                margin-bottom: 1.5rem;
                background: #fcfcfc;
                padding: 1rem;
                border-radius: 12px;
                border: 1px solid #eee;
                transition: all 0.3s ease;
            }
            .subject-item-container:hover {
                border-color: #6366f1;
                background: #fff;
            }
            .topic-input-wrapper {
                margin-top: 0.8rem;
                padding-left: 2.2rem;
                display: none; /* Varsayılan olarak kapalı */
            }
            .topic-input-wrapper.is-visible {
                display: block; /* Bu sınıf varsa aç */
            }
            .topic-text-input {
                width: 100%;
                padding: 10px 15px;
                border: 2px solid #e2e8f0;
                border-radius: 8px;
                font-size: 0.9rem;
                outline: none;
                transition: border-color 0.2s;
            }
            .topic-text-input:focus {
                border-color: #6366f1;
            }
        </style>
    </div>

</body>
</html>
