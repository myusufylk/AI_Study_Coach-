{% load static %}
<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haftalık Hedef - Eğitim Planlama</title>
    <!-- Modern Tasarım İçin İnter Fontu -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS Bağlantısı - Django Static ile -->
    <link rel="stylesheet" href="{% static 'css/subjects_style.css' %}">
</head>

<body>

    <div class="goals-container">
        <div class="goals-header">
            <h1>Haftalık Çalışma Planı</h1>
            <p>Hedeflerinizi belirleyerek başarıya ulaşın</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="goals-form-group">
                <label for="hours_per_day" class="goals-form-label">Günde kaç saat çalışacaksın?</label>
                <input type="number" id="hours_per_day" name="hours_per_day" class="goals-form-control" min="1" max="24"
                    placeholder="Örn: 4">
            </div>

            <div class="goals-form-group">
                <label for="days_per_week" class="goals-form-label">Haftada kaç gün çalışacaksın?</label>
                <input type="number" id="days_per_week" name="days_per_week" class="goals-form-control" min="1" max="7"
                    placeholder="Örn: 5">
            </div>

            <div class="goals-form-group">
                <label for="priority_subject" class="goals-form-label">Öncelikli dersin hangisi?</label>
                <select id="priority_subject" name="priority_subject" class="goals-form-control">
                    <option value="" disabled selected>Ders seçiniz...</option>
                    <option value="matematik">Matematik</option>
                    <option value="fizik">Fizik</option>
                    <option value="kimya">Kimya</option>
                    <option value="biyoloji">Biyoloji</option>
                    <option value="turkce">Türkçe</option>
                    <option value="tarih">Tarih</option>
                    <option value="cografya">Coğrafya</option>
                    <option value="ingilizce">İngilizce</option>
                </select>
            </div>

            <div class="goals-form-group">
                <label for="goal_note" class="goals-form-label">Not / Hedef açıklaması</label>
                <textarea id="goal_note" name="goal_note" class="goals-form-control"
                    placeholder="Bu haftaki temel hedeflerini buraya yazabilirsin..."></textarea>
            </div>

            <button type="submit" class="goals-btn-submit">Planı Kaydet</button>
        </form>
    </div>

</body>

</html>
